# Runs the bot once a day on GitHub's free runners. No server needed.
# Paper trading by default. To go live: add repo secrets EXCHANGE_API_KEY and
# EXCHANGE_API_SECRET, then set repo variable LIVE=true.
name: trade
on:
  schedule:
    - cron: "10 0 * * *"   # just after the daily candle closes (00:00 UTC)
    - cron: "10 6 * * *"   # retry; a no-op if the first run succeeded
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trade
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trade
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          EXCHANGE_API_PASSWORD: ${{ secrets.EXCHANGE_API_PASSWORD }}
        run: python -m fabletrader run --once ${{ vars.LIVE == 'true' && '--live' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "fable-trader"
          git config user.email "fable-trader@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && git push)
